[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vco-isf-explorer"
version = "1.1.0"
description = "Portable desktop analysis procedure for VCO harmonic noise and ISF analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
live = ["numpy>=1.20"]
analysis = ["numpy>=1.20"]
test = ["numpy>=1.20"]

[project.scripts]
vco-isf = "isf_tool.cli:main"
vco-isf-ui = "isf_tool.cli:main"
vco-isf-tk = "isf_tool.cli:main"
vco-isf-web = "isf_tool.server:main"

[tool.setuptools.packages.find]
include = ["isf_tool*"]

[tool.setuptools.package-data]
isf_tool = ["ui/*"]
